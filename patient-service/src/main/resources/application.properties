# ========================
# PATIENT-SERVICE CONFIGURATION
# ========================

# Application name — This becomes the service name in Eureka!
spring.application.name=patient-service

# Server port: patient-service runs on the default port 8080
server.port=${PORT:8080}

# ========================
# EUREKA CLIENT CONFIGURATION
# ========================

# Tell this service where Eureka Server is running
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Use IP address instead of hostname (avoids hostname resolution issues)
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# ========================
# AUTH-SERVICE URL (via Eureka)
# ========================

# ★ BEFORE (hardcoded): http://localhost:8081/auth/validate
# ★ AFTER  (Eureka):    http://AUTH-SERVICE/auth/validate
#
# Instead of hardcoding localhost:8081, we use the SERVICE NAME "AUTH-SERVICE"
# (which matches spring.application.name in auth-service's properties).
# The @LoadBalanced RestTemplate will ask Eureka to resolve "AUTH-SERVICE"
# to the actual address (localhost:8081) automatically!
auth.service.url=${AUTH_SERVICE_URL:http://AUTH-SERVICE/auth/validate}

# ========================
# JWT SECURITY CONFIGURATION
# ========================

# Secret Key (Must match exactly the key in auth-service for stateless token signature validation)
security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ========================
# DATABASE CONFIGURATION (MySQL)
# ========================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:oracle}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA & HIBERNATE CONFIGURATION
# ========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


