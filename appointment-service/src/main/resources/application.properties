# ========================
# APPOINTMENT-SERVICE CONFIGURATION
# ========================

spring.application.name=appointment-service
server.port=8083

# ========================
# EUREKA CLIENT CONFIGURATION
# ========================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ========================
# DATABASE CONFIGURATION (MySQL)
# ========================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:oracle}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA & HIBERNATE CONFIGURATION
# ========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# JWT SECURITY CONFIGURATION
# ========================

security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
