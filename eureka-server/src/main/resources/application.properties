# ========================
# EUREKA SERVER CONFIGURATION
# ========================

# Application name
spring.application.name=eureka-server

# Eureka Server runs on port 8761 (standard default port)
server.port=${PORT:8761}

# DON'T register this server as a client with itself
# (Eureka Server is the registry, it doesn't need to register itself)
eureka.client.register-with-eureka=false

# DON'T fetch the registry from itself
# (It IS the registry, so there's nothing to fetch)
eureka.client.fetch-registry=false

# Don't wait for other instances during startup (we only have one Eureka Server)
eureka.server.wait-time-in-ms-when-sync-empty=0