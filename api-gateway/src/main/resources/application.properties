# ========================
# API GATEWAY CONFIGURATION
# ========================

# Application name — This becomes the service name in Eureka!
spring.application.name=api-gateway

# Server port: API Gateway runs on port 9090
# Frontend will call http://localhost:9090 instead of individual service ports
server.port=9090

# ========================
# EUREKA CLIENT CONFIGURATION
# ========================

# Tell the gateway where Eureka Server is running
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Use IP address in Eureka registration (avoids hostname resolution issues)
eureka.instance.prefer-ip-address=true

# ========================
# SPRING CLOUD GATEWAY ROUTE CONFIGURATION
# ========================
#
# HOW ROUTING WORKS:
# ──────────────────────────────────────────────────────
# When the frontend sends:    http://localhost:9090/auth/login
#
# Gateway checks all route predicates:
#   Route 1 predicate: Path=/auth/**  ← MATCH!
#   Route 1 uri:       lb://AUTH-SERVICE
#
# Gateway asks Eureka: "Where is AUTH-SERVICE?"
# Eureka responds:     "AUTH-SERVICE is at localhost:8081"
#
# Gateway forwards:    http://localhost:8081/auth/login
# ──────────────────────────────────────────────────────

# --- Route 1: AUTH-SERVICE ---
# All requests matching /auth/** are forwarded to AUTH-SERVICE via Eureka
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# --- Route 2: PATIENT-SERVICE ---
# All requests matching /patients/** are forwarded to PATIENT-SERVICE via Eureka
spring.cloud.gateway.routes[1].id=patient-service-route
spring.cloud.gateway.routes[1].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/patients/**

# --- Route 3: DOCTOR-SERVICE ---
spring.cloud.gateway.routes[2].id=doctor-service-route
spring.cloud.gateway.routes[2].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/doctors/**

# --- Route 4: APPOINTMENT-SERVICE ---
spring.cloud.gateway.routes[3].id=appointment-service-route
spring.cloud.gateway.routes[3].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/appointments/**

# --- Route 5: BILLING-SERVICE ---
spring.cloud.gateway.routes[4].id=billing-service-route
spring.cloud.gateway.routes[4].uri=lb://BILLING-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/bills/**

# --- Route 6: AI-SERVICE ---
spring.cloud.gateway.routes[5].id=ai-service-route
spring.cloud.gateway.routes[5].uri=${AI_SERVICE_URL:http://localhost:8000}
spring.cloud.gateway.routes[5].predicates[0]=Path=/ai/**


# ========================
# LOGGING (optional, for debugging routes)
# ========================
logging.level.org.springframework.cloud.gateway=DEBUG

# ========================
# CORS CONFIGURATION
# ========================
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
