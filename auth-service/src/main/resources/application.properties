# ========================
# AUTH-SERVICE CONFIGURATION
# ========================

# Application name — This becomes the service name in Eureka!
spring.application.name=auth-service

# Server port: auth-service runs on port 8081
server.port=8081

# ========================
# EUREKA CLIENT CONFIGURATION
# ========================

# Tell this service where Eureka Server is running
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# Use IP address in Eureka registration
eureka.instance.prefer-ip-address=true

# ========================
# DATABASE CONFIGURATION (MySQL)
# ========================

# Connection URL (creates hospital_db database automatically if it does not exist)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:oracle}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA & HIBERNATE CONFIGURATION
# ========================

# Automatically update the database schema based on JPA Entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (useful for learning/debugging)
spring.jpa.show-sql=true

# Hibernate SQL dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# JWT SECURITY CONFIGURATION
# ========================

# Secret Key (Must be at least 256 bits, base64-encoded. We use a standard secure 256-bit key)
security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Expiration time: 24 hours in milliseconds (1000 * 60 * 60 * 24 = 86400000)
security.jwt.expiration-time=86400000

